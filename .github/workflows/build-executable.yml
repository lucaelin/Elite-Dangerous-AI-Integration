name: Build and Test Executable

on: [push, pull_request]

jobs:
  e2e-and-scan:
    name: E2E Tests & Defender Scan in Fresh VM
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v2

      - name: Download build artifact
        run: |
          $artifact = Invoke-WebRequest -Uri https://github.com/RatherRude/Elite-Dangerous-AI-Integration/releases/download/v1.8.3/COVAS_NEXT_v1_8_3.zip -OutFile artifact.zip
          Expand-Archive -Path artifact.zip -Destination dist

      - name: List contents (debug)
        run: dir dist\AIGUI

      - name: Configure Windows Defender
        run: |
          Remove-MpPreference -ExclusionPath (Get-MpPreference).ExclusionPath
        shell: powershell

      - name: Run Defender scan
        run: |
          "C:\Program Files\Windows Defender\MpCmdRun.exe" -SignatureUpdate
          "C:\Program Files\Windows Defender\MpCmdRun.exe" -Scan -ScanType 3 -File $PWD\dist\AIGUI\AIGUI.exe
          "C:\Program Files\Windows Defender\MpCmdRun.exe" -Scan -ScanType 3 -File $PWD\dist\Chat\Chat.exe
          "C:\Program Files\Windows Defender\MpCmdRun.exe" -Scan -ScanType 3 -File $PWD
        shell: cmd
        continue-on-error: true

      - name: Output scan results
        run: |
          Get-Content $env:TEMP\MpCmdRun.log
          Get-MpThreatDetection
          $count = (Get-MpThreatDetection).Count

          exit $count

      - name: Run e2e tests
        run: |
          python --version
          python e2e/test_ChatExecutable.py
